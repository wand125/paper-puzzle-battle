<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Honey Islands · Analysis</title>
  <meta name="description" content="Explore Honey Islands Battle positions, move values and remaining puzzle solutions.">
  <link rel="icon" href="data:,">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('hib-paper-theme')==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../sitebar.css">
  <script type="module" src="app.js"></script>
</head>
<body class="app">
  <nav class="sitebar" data-current="analyze" data-base="../"></nav>
  <div class="page">
    <header>
      <h1 data-i18n="title">Honey Islands · Analysis</h1>
      <div class="preferences">
        <div id="language-toggle" class="small-toggle" role="group" aria-label="Language">
          <button type="button" data-language="ja" lang="ja">JA</button><button type="button" data-language="en" lang="en">EN</button>
        </div>
        <div id="theme-toggle" class="small-toggle" role="group" aria-label="Theme">
          <button type="button" data-theme-set="light" data-i18n="light">Light</button><button type="button" data-theme-set="dark" data-i18n="dark">Dark</button>
        </div>
      </div>
    </header>
    <main class="workspace">
      <div class="board-column">
        <section class="card board-card" aria-labelledby="position-heading">
          <div class="position-heading"><h2 id="position-heading" data-i18n="position">Position</h2><button type="button" id="new" data-i18n="new">New position</button></div>
          <p id="status" role="status" aria-live="polite"></p>
          <p id="count" class="counter">—</p>
          <p id="notice" role="status" class="muted"></p>
          <p id="error" role="alert" hidden></p>
          <svg id="board" viewBox="0 4 100 92" role="group" aria-label="Board"></svg>
          <p id="selection" class="muted"></p>
          <div class="navigation" role="group" aria-label="History" id="navigation">
            <button type="button" id="first">|◀</button><button type="button" id="previous">◀</button>
            <span id="history-position"></span>
            <button type="button" id="next">▶</button><button type="button" id="last">▶|</button>
          </div>
        </section>
      </div>
      <aside class="panel-column">
        <div class="panel-tabs" role="tablist" id="panel-tabs">
          <button type="button" role="tab" data-tab="moves" data-i18n="tabMoves">Moves</button>
          <button type="button" role="tab" data-tab="details" data-i18n="tabDetails">Position</button>
          <button type="button" role="tab" data-tab="kifu" data-i18n="tabKifu">Record</button>
          <button type="button" role="tab" data-tab="solutions" data-i18n="tabSolutions">Solutions</button>
          <button type="button" role="tab" data-tab="display" data-i18n="tabDisplay">Display</button>
          <button type="button" role="tab" data-tab="settings" data-i18n="tabSettings">Settings</button>
        </div>
        <section class="card" data-tab="moves" aria-labelledby="moves-heading">
          <h2 id="moves-heading" data-i18n="movesTable">Playable moves</h2>
          <p class="muted" data-i18n="tableHelp"></p>
          <div class="table-scroll">
          <table id="moves-table">
            <thead><tr>
              <th scope="col" aria-sort="ascending"><button type="button" data-sort="cell" data-i18n="cell">Cell</button></th>
              <th scope="col"><button type="button" data-sort="value" data-i18n="value">Value</button></th>
              <th scope="col"><button type="button" data-sort="n" data-i18n="after">Left</button></th>
              <th scope="col"><button type="button" data-sort="share" data-i18n="share">Share</button></th>
            </tr></thead>
            <tbody id="move-rows"></tbody>
          </table>
          </div>
          <button type="button" id="play-selected" data-i18n="playSelected" disabled>Play selected cell</button>
        </section>
        <section class="card" data-tab="details" aria-labelledby="details-heading">
          <h2 id="details-heading" data-i18n="positionDetails">Position details</h2>
          <dl id="position-details"></dl>
          <p id="position-value"></p><p id="value-source" class="muted"></p>
          <button type="button" id="deeper" data-i18n="deeper">Solve deeper (4×)</button>
        </section>
        <section class="card" data-tab="kifu" aria-labelledby="kifu-heading">
          <h2 id="kifu-heading" data-i18n="kifu">Move list</h2>
          <button type="button" id="initial" data-i18n="initial">Initial position</button>
          <ol id="kifu" class="kifu"></ol>
        </section>
        <section class="card" data-tab="solutions" aria-labelledby="solutions-heading">
          <h2 id="solutions-heading" data-i18n="solutions">Remaining solutions</h2>
          <p id="solutions-note" class="muted"></p>
          <button type="button" id="clear-solution" data-i18n="clearSolution" hidden>Clear outline</button>
          <div id="solutions-grid" class="solutions-grid"></div>
        </section>
        <section class="card" data-tab="display" aria-labelledby="display-heading">
          <h2 id="display-heading" data-i18n="display">Display</h2>
          <div class="overlays">
            <label><input id="show-eval" type="checkbox"><span data-i18n="showEval">Win/loss of each move</span></label>
            <label><input id="show-heat" type="checkbox"><span data-i18n="heat">Heat map</span></label>
            <label><input id="show-after" type="checkbox"><span data-i18n="showAfter">Solutions left after the move</span></label>
          </div>
          <div class="legend">
            <span><i class="sw stone"></i><span data-i18n="stone">Stone</span></span>
            <span><i class="sw fb"></i><span data-i18n="black">Determined black</span></span>
            <span><i class="sw fw"></i><span data-i18n="white">Determined white</span></span>
            <span><i class="sw mwin"></i><span data-i18n="win">Win</span></span>
            <span><i class="sw mlose"></i><span data-i18n="loss">Loss</span></span>
          </div>
          <p class="muted legend-note" data-i18n="overlayLegend"></p>
        </section>
        <section class="card" data-tab="settings" aria-labelledby="settings-heading">
          <h2 id="settings-heading" data-i18n="settings">Settings</h2>
          <fieldset><legend data-i18n="mode">Mode</legend>
            <div id="mode" class="toggle" role="group" aria-label="Mode">
              <button type="button" data-value="analyze" data-i18n="analyze">Analyze</button>
              <button type="button" data-value="ai2" data-i18n="humanFirst">vs AI (you first)</button>
              <button type="button" data-value="ai1" data-i18n="aiFirst">vs AI (AI first)</button>
              <button type="button" data-value="aiai" data-i18n="aiAI">AI vs AI</button>
            </div>
          </fieldset>
          <fieldset><legend data-i18n="rule">Rule</legend>
            <div id="rule" class="toggle" role="group" aria-label="Rule">
              <button type="button" data-value="normal" data-i18n="standard">Standard</button>
              <button type="button" data-value="pass" data-i18n="passRule">Redundant hints</button>
            </div>
          </fieldset>
          <label class="time"><span data-i18n="aiTime">AI time (seconds)</span><input id="ai-time" type="number" min="0.1" max="600" step="0.1" value="2" inputmode="decimal"></label>
          <button type="button" id="resume" data-i18n="resume" hidden>Resume AI</button>
        </section>
        <section class="card" data-tab="settings" aria-labelledby="sharing-heading">
          <h2 id="sharing-heading" data-i18n="sharing">Share & import</h2>
          <div class="row"><button type="button" id="copy-link" data-i18n="copyLink">Copy link</button><button type="button" id="copy-moves" data-i18n="copyMoves">Copy moves</button></div>
          <form id="import-form">
            <label for="import-moves" data-i18n="importLabel">Cell indices, separated by dots or commas</label>
            <div class="row"><input id="import-moves" type="text" placeholder="12.40.7" autocomplete="off" spellcheck="false"><button type="submit" id="import" data-i18n="import">Import</button></div>
          </form>
          <label for="example" data-i18n="loadExample">Load example</label>
          <select id="example"><option value="" data-i18n="chooseExample">Choose a perfect-play line…</option><option value="normal" data-i18n="normalExample">Standard · perfect play</option><option value="pass" data-i18n="passExample">Redundant hints · perfect play</option></select>
        </section>
        <details class="card help" data-tab="settings">
          <summary data-i18n="howTo">How to use</summary>
          <ul><li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li><li data-i18n="how4"></li><li data-i18n="how5"></li></ul>
        </details>
      </aside>
    </main>
  </div>
  <noscript>JavaScript is required. / JavaScript を有効にしてください。</noscript>
</body>
</html>
